<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>City Life: Vadodara</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87b8df;font-family:Arial}
#hud{
 position:fixed;top:12px;left:12px;z-index:5;
 color:white;background:rgba(20,25,35,.85);
 padding:14px;border-radius:12px;line-height:1.8;
 font-size:14px
}
#mapBtn{
 position:fixed;top:12px;right:12px;z-index:6;
 padding:13px;border:0;border-radius:10px;
 background:#202630;color:white;font-weight:bold
}
#mapOverlay{
 display:none;position:fixed;inset:0;z-index:10;
 background:rgba(10,15,20,.94);color:white;text-align:center;
 padding:15px
}
#mapCanvas{
 width:min(90vw,700px);height:min(90vw,700px);
 max-height:80vh;background:#789a68;border:2px solid white;
 display:block;margin:10px auto
}
#closeMap{padding:12px 30px;border:0;border-radius:10px}
#status{
 position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
 background:rgba(0,0,0,.7);color:white;padding:12px 20px;
 border-radius:12px
}
</style>
</head>
<body>

<div id="hud">
<b>🏙 CITY LIFE: VADODARA</b><br>
WASD / Arrow keys: Move<br>
SHIFT: Sprint<br>
E: Enter / Exit car<br>
Mouse drag: Camera<br>
M: Map<br>
<div id="vehicleStatus">Walking</div>
</div>

<button id="mapBtn">🗺 MAP (M)</button>
<div id="status">Vadodara</div>

<div id="mapOverlay">
<h2>VADODARA CITY MAP</h2>
<canvas id="mapCanvas" width="700" height="700"></canvas>
<button id="closeMap">CLOSE MAP</button>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bc7e7);
scene.fog=new THREE.Fog(0x9bc7e7,450,1200);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,2000);

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x60734b,2));

const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(180,240,120);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const mats={};
function material(color,rough=.85){
 return new THREE.MeshStandardMaterial({color,roughness:rough});
}

mats.road=material(0x30343a);
mats.sidewalk=material(0xbab7ac);
mats.grass=material(0x86a76b);
mats.white=material(0xffffff);
mats.window=material(0x75a8c2,.35);
mats.skin=material(0xb98059);
mats.black=material(0x222222);

// Ground
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(1200,1200),
 mats.grass
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// Utilities
 function label(x,y,z,text,color=0x333333){
 const canvas=document.createElement('canvas');
 canvas.width=512;
 canvas.height=128;
 const ctx=canvas.getContext('2d');
 ctx.fillStyle='white';
 ctx.fillRect(0,0,512,128);
 ctx.fillStyle='#222';
 ctx.font='bold 42px Arial';
 ctx.textAlign='center';
 ctx.fillText(text,256,78);
 const texture=new THREE.CanvasTexture(canvas);
 const sprite=new THREE.Sprite(
   new THREE.SpriteMaterial({map:texture})
 );
 sprite.position.set(x,y,z);
 sprite.scale.set(35,9,1);
 scene.add(sprite);
 return sprite;
}
function box(w,h,d,color,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 scene.add(m);
 return m;
}

function road(x,z,w,d){
 box(w,.12,d,0x30343a,x,.05,z);
}

// City roads: planned locations
const majorX=[-300,-180,-60,60,180,300];
const majorZ=[-300,-180,-60,60,180,300];

for(const x of majorX)road(x,0,18,700);
for(const z of majorZ)road(0,z,700,18);

// Smaller streets inside blocks
for(let x=-240;x<=240;x+=60){
 if(!majorX.includes(x))road(x,0,9,600);
}
for(let z=-240;z<=240;z+=60){
 if(!majorZ.includes(z))road(0,z,600,9);
}

// Road lane markings
function line(x,z,w,d){
 box(w,.13,d,0xffffff,x,.12,z);
}

for(const x of majorX){
 for(let z=-330;z<=330;z+=30){
  line(x,z,1,.5);
 }
}
for(const z of majorZ){
 for(let x=-330;x<=330;x+=30){
  line(x,z,.5,1);
 }
}

// Sidewalks beside major roads
for(const x of majorX){
 box(2,.18,700,0xc2bfb4,x-11,.14,0);
 box(2,.18,700,0xc2bfb4,x+11,.14,0);
}
for(const z of majorZ){
 box(700,.18,2,0xc2bfb4,0,.14,z-11);
 box(700,.18,2,0xc2bfb4,0,.14,z+11);
}

// Houses with detailed façades
function house(x,z,style=0){
 const g=new THREE.Group();
 const colors=[0xd6b38b,0xd3c4a8,0xc9d1c0,0xe0c6a5,0xc5b7a5];
 const color=colors[style%colors.length];

 const w=13,d=11,h=6+Math.random()*2;

 const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));
 body.position.y=h/2;
 g.add(body);

 // Roof
 const roof=new THREE.Mesh(
  new THREE.BoxGeometry(w+1,.4,d+1),
  material(0x765342)
 );
 roof.position.y=h+.2;
 g.add(roof);

 // Front door
 const door=new THREE.Mesh(
  new THREE.BoxGeometry(1.6,2.8,.12),
  material(0x573b2d)
 );
 door.position.set(0,1.4,d/2+.08);
 g.add(door);

 // Windows
 for(let s of [-1,1]){
  const win=new THREE.Mesh(
   new THREE.BoxGeometry(1.6,1.6,.12),
   mats.window
  );
  win.position.set(s*3,3,d/2+.08);
  g.add(win);

  const sill=new THREE.Mesh(
   new THREE.BoxGeometry(2,.15,.3),
   material(0xeee2cc)
  );
  sill.position.set(s*3,2.1,d/2+.15);
  g.add(sill);
 }

 // Balcony on some houses
 if(style%2===0){
  const balcony=new THREE.Mesh(
   new THREE.BoxGeometry(4,.25,1.5),
   material(0xd5d0c5)
  );
  balcony.position.set(0,4.5,d/2+.5);
  g.add(balcony);

  const rail=new THREE.Mesh(
   new THREE.BoxGeometry(4,.8,.1),
   material(0xaaa69b)
  );
  rail.position.set(0,4.9,d/2+1);
  g.add(rail);
 }

 g.position.set(x,0,z);
 scene.add(g);
}

// Buildings only placed in selected parcels, away from major roads
function residentialBlock(cx,cz){
 for(let dx=-22;dx<=22;dx+=22){
  for(let dz=-22;dz<=22;dz+=22){
   house(cx+dx,cz+dz,Math.floor(Math.random()*5));
  }
 }
}

// Residential districts
residentialBlock(-240,-240);
residentialBlock(-240,-120);
residentialBlock(-120,-240);
residentialBlock(-240,240);
residentialBlock(-120,240);
residentialBlock(240,-240);
residentialBlock(240,-120);
residentialBlock(240,240);
residentialBlock(120,240);

// Trees
function tree(x,z,size=1){
 const g=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.35*size,.5*size,4*size,8),
  material(0x69472d)
 );
 trunk.position.y=2*size;
 g.add(trunk);

 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(3.2*size,12,12),
  material(0x367a3c)
 );
 leaves.position.y=5*size;
 g.add(leaves);

 g.position.set(x,0,z);
 scene.add(g);
}

// Trees on roadsides and open areas
for(let x=-330;x<=330;x+=35){
 tree(x,-340);
 tree(x,340);
}
for(let z=-330;z<=330;z+=35){
 tree(-340,z);
 tree(340,z);
}

// Market shops
function shop(x,z,color){

 );
 body.position.y=3.5;
 g.add(body);

 const storefront=new THREE.Mesh(
  new THREE.BoxGeometry(8,3,.2),

 );

 g.add(storefront);

 const awning=new THREE.Mesh(
  new THREE.BoxGeometry(12,1,2),
  material(0xa23b2c)
 );
 awning.position.set(0,5.5,6);
 g.add(awning);

 const signboard=new THREE.Mesh(
  new THREE.BoxGeometry(8,1.2,.2),

 );
 signboard.position.set(0,6.2,5.1);

 g.position.set(x,0,z);

// Mangal Bazaar district
for(let x=-25;x<=25;x+=15){
 shop(x,20,0xd6aa7c);
 shop(x,55,0xd4a57a);

}

// Mangal Bazaar-inspired gateway
function gateway(x,z){
 const g=new THREE.Group();
 const ivory=material(0xe8dfcc);
 const stone=material(0x92745b);

 // Side piers
 for(const s of [-1,1]){
  const pier=new THREE.Mesh(new THREE.BoxGeometry(8,14,6),stone);
  pier.position.set(s*14,7,0);
  g.add(pier);

  const cap=new THREE.Mesh(new THREE.BoxGeometry(10,1,7),ivory);
  cap.position.set(s*14,14,0);
  g.add(cap);
 }

 // Central arch opening: two pillars and curved arch elements
 const left=new THREE.Mesh(new THREE.BoxGeometry(5,10,6),ivory);
 left.position.set(-5,5,0);
 g.add(left);

 const right=new THREE.Mesh(new THREE.BoxGeometry(5,10,6),ivory);
 right.position.set(5,5,0);
 g.add(right);

 const archTop=new THREE.Mesh(new THREE.BoxGeometry(14,3,6),ivory);
 archTop.position.y=11;
 g.add(archTop);

 // Decorative arch curve
 for(let i=0;i<=8;i++){
  const a=Math.PI*i/8;
  const block=new THREE.Mesh(
   new THREE.BoxGeometry(1.6,1.6,6.1),
   ivory
  );
  block.position.set(Math.cos(a)*7,5+Math.sin(a)*5,0);
  g.add(block);
 }

 const upper=new THREE.Mesh(new THREE.BoxGeometry(38,5,6),ivory);
 upper.position.y=16;
 g.add(upper);

 const parapet=new THREE.Mesh(new THREE.BoxGeometry(40,2,6),ivory);
 parapet.position.y=19;
 g.add(parapet);

 // Small ornamental towers
 for(const s of [-1,0,1]){
  const tower=new THREE.Mesh(
   new THREE.ConeGeometry(3,6,8),
   ivory
  );
  tower.position.set(s*13,22,0);
  g.add(tower);
 }

 g.position.set(x,0,z);
 scene.add(g);
}

gateway(0,0);

// Mehsana Nagar Ground
const field=new THREE.Mesh(
 new THREE.BoxGeometry(130,.2,110),
 material(0x689747)
);
field.position.set(-240,.1,120);
scene.add(field);

const fenceMat=material(0xc1c1b7);
for(let s of [-1,1]){

 box(1,1,110,fenceMat,-240+s*66,1,120);

 tree(x,175);
}

label(-240,8,120,"MEHSANA NAGAR GROUND",0x2e713a);

// Temple
function temple(x,z){

temple(-300,-250);
label(-300,38,-215,"TEMPLE",0x8c6541);

// Apartment towers inspired by Alembic Kiara
function apartment(x,z,w,d,floors){
 const g=new THREE.Group();
 const h=floors*3;

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  material(0xc1b29a)
 );
 body.position.y=h/2;
 g.add(body);

 // Repeated floor bands
 for(let f=1;f<floors;f++){
  const band=new THREE.Mesh(
   new THREE.BoxGeometry(w+.4,.18,d+.3),
   material(0x7a6b59)
  );
  band.position.y=f*3;
  g.add(band);
 }

 // Windows and balconies
 for(let f=0;f<floors;f++){
  for(let c=-1;c<=1;c++){
   const win=new THREE.Mesh(
    new THREE.BoxGeometry(1.5,1.8,.1),
    mats.window
   );
   win.position.set(c*4,f*3+1.7,d/2+.1);
   g.add(win);

   const balcony=new THREE.Mesh(
    new THREE.BoxGeometry(2.5,.15,1),
    material(0xd2c8b8)
   );
   balcony.position.set(c*4,f*3+1,d/2+.5);
   g.add(balcony);
  }
 }

 g.position.set(x,0,z);
 scene.add(g);
}

apartment(250,120,25,20,18);
apartment(285,120,25,20,14);
apartment(320,120,25,20,11);

label(285,58,160,"KIARA RESIDENCES",0x846e50);

// Airport
function airport(){
 const g=new THREE.Group();

 // Main terminal
 const base=new THREE.Mesh(
  new THREE.BoxGeometry(130,14,44),
  material(0xc1c6cb)
 );
 base.position.y=7;
 g.add(base);

 // Glass front
 const glass=new THREE.Mesh(
  new THREE.BoxGeometry(125,9,.5),
  material(0x6faec9,.35)
 );
 glass.position.set(0,5,22.2);
 g.add(glass);

 // Continuous curved roof using cross-section extrusion
 const roofShape=new THREE.Shape();
 roofShape.moveTo(-65,0);
 roofShape.quadraticCurveTo(-55,16,-30,22);
 roofShape.quadraticCurveTo(0,27,30,22);
 roofShape.quadraticCurveTo(55,16,65,0);
 roofShape.lineTo(65,-2);
 roofShape.lineTo(-65,-2);
 roofShape.closePath();

 const roof=new THREE.Mesh(
  new THREE.ExtrudeGeometry(roofShape,{depth:48,bevelEnabled:false}),
  material(0xbfc8cf)
 );
 roof.position.set(0,12,-24);
 g.add(roof);

 // Roof rails
 for(let x=-50;x<=50;x+=25){
  const rail=new THREE.Mesh(
   new THREE.BoxGeometry(1,1,44),
   material(0x778995)
  );
  rail.position.set(x,18,0);
  g.add(rail);
 }

 // Airport apron
 const apron=new THREE.Mesh(
  new THREE.BoxGeometry(190,.1,110),
  material(0x85898d)
 );
 apron.position.set(0,.1,-80);
 g.add(apron);

 // Runway
 const runway=new THREE.Mesh(
  new THREE.BoxGeometry(300,.12,50),
  mats.road
 );
 runway.position.set(0,.15,-180);
 g.add(runway);

 // Runway stripes
 for(let x=-120;x<=120;x+=30){
  const stripe=new THREE.Mesh(
   new THREE.BoxGeometry(8,.15,1),
   mats.white
  );
  stripe.position.set(x,.25,-180);
  g.add(stripe);
 }

 g.position.set(280,0,-300);
 scene.add(g);
}

airport();

// Flyover
box(220,3,14,0x888888,0,12,-120);
for(let x=-90;x<=90;x+=30){

// Traffic lights
const trafficLights=[];

function trafficLight(x,z){
 const g=new THREE.Group();

 const pole=new THREE.Mesh(
  new THREE.CylinderGeometry(.15,.15,7,8),
  material(0x333333)
 );
 pole.position.y=3.5;
 g.add(pole);

 const housing=new THREE.Mesh(
  new THREE.BoxGeometry(.8,2.4,.5),
  material(0x202020)
 );
 housing.position.y=6.3;
 g.add(housing);

 const bulbs=[];
 for(let i=0;i<3;i++){
  const bulb=new THREE.Mesh(
   new THREE.SphereGeometry(.25,12,12),
   new THREE.MeshStandardMaterial({color:0x333333,emissive:0x000000})
  );
  bulb.position.y=7-i*.8;
  g.add(bulb);
  bulbs.push(bulb);
 }

 g.position.set(x,0,z);
 scene.add(g);
 trafficLights.push(bulbs);
}

trafficLight(75,75);
trafficLight(75,-75);
trafficLight(-75,75);
trafficLight(-75,-75);

function updateLights(t){
 const phase=Math.floor(t/4)%3;
 trafficLights.forEach(bulbs=>{
  bulbs.forEach((b,i)=>{
   const active=i===phase;
   b.material.color.setHex(active?[0xff3333,0xffaa00,0x22cc44][i]:0x333333);
   b.material.emissive.setHex(active?[0xff3333,0xffaa00,0x22cc44][i]:0);
  });
 });
}

// Vehicles

// Controls
const keys={};
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key.toLowerCase()==='m')toggleMap();
 if(e.key.toLowerCase()==='e')toggleCar();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let yaw=0,camYaw=0,camPitch=.4;
let dragging=false,lastX=0,lastY=0;

renderer.domElement.addEventListener('pointerdown',e=>{
 dragging=true;lastX=e.clientX;lastY=e.clientY;
});
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{
 if(!dragging)return;
 camYaw-=(e.clientX-lastX)*.005;
 camPitch=Math.max(-.1,Math.min(1.2,camPitch+(e.clientY-lastY)*.004));
 lastX=e.clientX;lastY=e.clientY;
});

// Driving
let activeCar=null;

function toggleCar(){
 if(activeCar){
  player.position.copy(activeCar.g.position);
  activeCar.speed=0;
  activeCar=null;
  document.getElementById('vehicleStatus').textContent='Walking';
  return;
 }

 let nearest=null,distance=8;
 for(const c of cars){
  const d=player.position.distanceTo(c.g.position);
  if(d<distance){nearest=c;distance=d;}
 }

 if(nearest){
  activeCar=nearest;
  document.getElementById('vehicleStatus').textContent='Driving';
 }
}

// Map
const overlay=document.getElementById('mapOverlay');
const canvas=document.getElementById('mapCanvas');

function toggleMap(){
 overlay.style.display=overlay.style.display==='block'?'none':'block';
 drawMap();
}

document.getElementById('mapBtn').onclick=toggleMap;
document.getElementById('closeMap').onclick=toggleMap;

function drawMap(){
 const ctx=canvas.getContext('2d');
 ctx.clearRect(0,0,700,700);
 ctx.fillStyle='#789a68';
 ctx.fillRect(0,0,700,700);

 // Major roads
 ctx.fillStyle='#333333';
 for(const n of [-300,-180,-60,60,180,300]){
  const px=350+n;
  const py=350+n;
  ctx.fillRect(px-9,0,18,700);
  ctx.fillRect(0,py-9,700,18);
 }

 // Minor streets
 ctx.fillStyle='#505050';
 for(const n of [-240,-120,120,240]){
  ctx.fillRect(350+n-4,0,8,700);
  ctx.fillRect(0,350+n-4,700,8);
 }

 // Ground
 ctx.fillStyle='#67a147';
 ctx.fillRect(50,470,130,110);
 ctx.strokeStyle='#ddd';
 ctx.strokeRect(50,470,130,110);
 mapText(ctx,'MEHSANA GROUND',55,520);

 // Market
 ctx.fillStyle='#c99c70';
 ctx.fillRect(290,290,100,80);
 mapText(ctx,'MANGAL BAZAAR',295,330);

 // Temple
 ctx.fillStyle='#e0c6a8';
 ctx.fillRect(40,50,100,90);
 mapText(ctx,'TEMPLE',60,100);

 // Towers
 ctx.fillStyle='#b9ae98';
 ctx.fillRect(510,450,130,100);
 mapText(ctx,'KIARA',550,500);

 // Airport
 ctx.fillStyle='#898989';
 ctx.fillRect(510,30,150,100);
 ctx.fillStyle='#b9c8d5';
 ctx.fillRect(525,50,120,30);
 mapText(ctx,'AIRPORT',550,110);

 // Player
 const px=350+player.position.x;
 const pz=350+player.position.z;
 ctx.fillStyle='#ff3333';
 ctx.beginPath();
 ctx.arc(px,pz,7,0,Math.PI*2);
 ctx.fill();

 mapText(ctx,'YOU',px+10,pz);
}

function mapText(ctx,text,x,y){
 ctx.fillStyle='white';
 ctx.font='bold 13px Arial';
 ctx.fillText(text,x,y);
}

// Animation
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 const t=clock.elapsedTime;

 updateLights(t);

 if(activeCar){
  if(keys.w||keys.arrowup)activeCar.speed=Math.min(activeCar.speed+dt*12,35);
  if(keys.s||keys.arrowdown)activeCar.speed=Math.max(activeCar.speed-dt*18,-12);
  if(!keys.w&&!keys.s&&!keys.arrowup&&!keys.arrowdown)activeCar.speed*=.985;

  if(keys.a||keys.arrowleft)activeCar.g.rotation.y+=dt*1.5;
  if(keys.d||keys.arrowright)activeCar.g.rotation.y-=dt*1.5;

  const dir=new THREE.Vector3(
   Math.sin(activeCar.g.rotation.y),0,
   Math.cos(activeCar.g.rotation.y)
  );

  activeCar.g.position.addScaledVector(dir,activeCar.speed*dt);
  player.position.copy(activeCar.g.position);
  player.rotation.y=activeCar.g.rotation.y;
 }else{
  let move=0,turn=0;

  if(keys.w||keys.arrowup)move=1;
  if(keys.s||keys.arrowdown)move=-1;
  if(keys.a||keys.arrowleft)turn=1;
  if(keys.d||keys.arrowright)turn=-1;

  if(move){
   yaw+=turn*dt*2;
   const speed=keys.shift?20:12;
   player.position.x+=Math.sin(yaw)*move*speed*dt;
   player.position.z+=Math.cos(yaw)*move*speed*dt;
   player.rotation.y=yaw;
  }

  legs.forEach((l,i)=>l.rotation.x=move*Math.sin(t*8+i*Math.PI)*.4);
  arms.forEach((a,i)=>a.rotation.x=move*Math.sin(t*8+i*Math.PI)*.3);
 }

 npcs.forEach(n=>{
  n.g.position.x=n.x+Math.sin(t+n.phase)*2;
  n.g.position.z=n.z+Math.cos(t+n.phase)*2;
  n.legs.forEach((l,i)=>l.rotation.x=Math.sin(t*3+n.phase+i*Math.PI)*.25);
 });

 const target=new THREE.Vector3(
  player.position.x+Math.sin(camYaw)*18,
  player.position.y+8+camPitch*10,
  player.position.z+Math.cos(camYaw)*18
 );

 camera.position.lerp(target,.08);
 camera.lookAt(player.position.x,player.position.y+1,player.position.z);

 renderer.render(scene,camera);
}

animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
