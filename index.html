<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Life Gujarat</title>
<style>
body { margin:0; overflow:hidden; font-family:Arial; background:#87ceeb; }
#ui {
 position:absolute;top:10px;left:10px;color:white;
 background:rgba(0,0,0,.65);padding:12px;border-radius:10px;
}
#map {
 position:absolute;right:10px;top:10px;
 width:160px;height:160px;background:#222;
 border:3px solid white;border-radius:8px;
}
</style>
</head>
<body>
<div id="ui">CITY LIFE GUJARAT<br>WASD: Move | SHIFT: Sprint</div>
<canvas id="map" width="160" height="160"></canvas>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2));
const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(30,50,30);
scene.add(sun);

const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(500,500),
 new THREE.MeshStandardMaterial({color:0x567d46})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

// Roads
const road = new THREE.Mesh(
 new THREE.BoxGeometry(20,0.1,500),
 new THREE.MeshStandardMaterial({color:0x333333})
);
road.position.y=.05;
scene.add(road);

const road2 = new THREE.Mesh(
 new THREE.BoxGeometry(500,0.1,20),
 new THREE.MeshStandardMaterial({color:0x333333})
);
road2.position.y=.05;
scene.add(road2);

// Road markings
for(let i=-240;i<240;i+=15){
 const stripe=new THREE.Mesh(
  new THREE.BoxGeometry(.4,.12,6),
  new THREE.MeshStandardMaterial({color:0xffffff})
 );
 stripe.position.set(0,.12,i);
 scene.add(stripe);

 const stripe2=new THREE.Mesh(
  new THREE.BoxGeometry(6,.12,.4),
  new THREE.MeshStandardMaterial({color:0xffffff})
 );
 stripe2.position.set(i,.12,0);
 scene.add(stripe2);
}

// Buildings
const buildings=[];
for(let i=0;i<100;i++){
 let x=(Math.random()-0.5)*400;
 let z=(Math.random()-0.5)*400;
 if(Math.abs(x)<18 || Math.abs(z)<18)continue;

 let w=8+Math.random()*15;
 let h=10+Math.random()*45;
 let d=8+Math.random()*15;

 const b=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(Math.random(),.3,.5)})
 );
 b.position.set(x,h/2,z);
 scene.add(b);
 buildings.push({x,z,w,d});
}

// Trees
for(let i=0;i<80;i++){
 let x=(Math.random()-0.5)*400;
 let z=(Math.random()-0.5)*400;
 if(Math.abs(x)<15 || Math.abs(z)<15)continue;

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.3,.5,3),
  new THREE.MeshStandardMaterial({color:0x79502b})
 );
 trunk.position.set(x,1.5,z);
 scene.add(trunk);

 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(2.5),
  new THREE.MeshStandardMaterial({color:0x228833})
 );
 leaves.position.set(x,4,z);
 scene.add(leaves);
}

// Player
const player=new THREE.Group();
const body=new THREE.Mesh(
 new THREE.CapsuleGeometry(0.7,1.4,4,8),
 new THREE.MeshStandardMaterial({color:0x2255ff})
);
body.position.y=1.4;
player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.45),
 new THREE.MeshStandardMaterial({color:0xffcc99})
);
head.position.y=2.6;
player.add(head);
scene.add(player);

// Traffic cars
const cars=[];
const carColors=[0xff2222,0xffffff,0x2222ff,0xffff00,0x111111];

function makeCar(x,z,axis,direction,color){
 const car=new THREE.Group();

 const base=new THREE.Mesh(
  new THREE.BoxGeometry(2,1,4),
  new THREE.MeshStandardMaterial({color})
 );
 base.position.y=.7;
 car.add(base);

 const top=new THREE.Mesh(
  new THREE.BoxGeometry(1.5,.8,2),
  new THREE.MeshStandardMaterial({color:0x88bbdd})
 );
 top.position.y=1.4;
 car.add(top);

 car.position.set(x,0,z);
 scene.add(car);
 cars.push({car,axis,direction,speed:5+Math.random()*4});
}

for(let i=0;i<8;i++){
 makeCar(-5,(i*55)-200,'z',1,carColors[i%5]);
 makeCar(5,(i*55)-200,'z',-1,carColors[(i+2)%5]);
 makeCar((i*55)-200,-5,'x',1,carColors[(i+1)%5]);
 makeCar((i*55)-200,5,'x',-1,carColors[(i+3)%5]);
}

// Input
const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));

let angle=0;
const clock=new THREE.Clock();

// Mini-map
const mapCanvas=document.getElementById('map');
const ctx=mapCanvas.getContext('2d');

function drawMap(){
 ctx.clearRect(0,0,160,160);
 ctx.fillStyle='#477744';
 ctx.fillRect(0,0,160,160);

 ctx.fillStyle='#444';
 ctx.fillRect(70,0,20,160);
 ctx.fillRect(0,70,160,20);

 ctx.fillStyle='white';
 ctx.fillRect(78,0,4,160);
 ctx.fillRect(0,78,160,4);

 // Cars
 cars.forEach(c=>{
  const x=80+c.car.position.x*.35;
  const y=80+c.car.position.z*.35;
  if(x>0&&x<160&&y>0&&y<160){
   ctx.fillStyle='red';
   ctx.fillRect(x-2,y-2,4,4);
  }
 });

 // Player
 ctx.fillStyle='#00ffff';
 ctx.beginPath();
 ctx.arc(80,80,5,0,Math.PI*2);
 ctx.fill();
}

function update(dt){
 let moveX=0,moveZ=0;
 if(keys['w'])moveZ-=1;
 if(keys['s'])moveZ+=1;
 if(keys['a'])moveX-=1;
 if(keys['d'])moveX+=1;

 const moving=moveX!==0||moveZ!==0;
 if(moving){
  const len=Math.hypot(moveX,moveZ);
  moveX/=len;moveZ/=len;

  const speed=keys['shift']?12:6;
  player.position.x+=moveX*speed*dt;
  player.position.z+=moveZ*speed*dt;

  angle=Math.atan2(moveX,moveZ);
  player.rotation.y=angle;
 }

 // Keep player in world
 player.position.x=Math.max(-240,Math.min(240,player.position.x));
 player.position.z=Math.max(-240,Math.min(240,player.position.z));

 // Traffic
 cars.forEach(c=>{
  if(c.axis==='z'){
   c.car.position.z+=c.direction*c.speed*dt;
   if(c.car.position.z>250)c.car.position.z=-250;
   if(c.car.position.z<-250)c.car.position.z=250;
  }else{
   c.car.position.x+=c.direction*c.speed*dt;
   if(c.car.position.x>250)c.car.position.x=-250;
   if(c.car.position.x<-250)c.car.position.x=250;
  }
 });

 // Smooth camera
 const target=new THREE.Vector3(
  player.position.x,
  player.position.y+5,
  player.position.z+10
 );
 camera.position.lerp(target,1-Math.pow(.001,dt));
 camera.lookAt(player.position.x,player.position.y+1,player.position.z);

 drawMap();
}

function animate(){
 requestAnimationFrame(animate);
 update(clock.getDelta());
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
