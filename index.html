<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Life - Open World</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
}
canvas {
  display: block;
}
#hud {
  position: absolute;
  top: 15px;
  left: 15px;
  color: white;
  background: rgba(0,0,0,0.65);
  padding: 15px;
  border-radius: 10px;
  z-index: 5;
}
</style>
</head>

<body>

<div id="hud">
  <h2>🌆 CITY LIFE</h2>
  <p>W A S D - Move</p>
  <p>Arrow keys - Move</p>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 100, 400);

const camera = new THREE.PerspectiveCamera(
  75, window.innerWidth / window.innerHeight, 0.1, 1000
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const ambient = new THREE.HemisphereLight(0xffffff, 0x555555, 2);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(80, 100, 50);
sun.castShadow = true;
scene.add(sun);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  new THREE.MeshStandardMaterial({ color: 0x477a42 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Main road
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 400),
  new THREE.MeshStandardMaterial({ color: 0x292929 })
);
road.rotation.x = -Math.PI / 2;
road.position.y = 0.03;
scene.add(road);

// Road markings
for (let z = -190; z < 200; z += 12) {
  const stripe = new THREE.Mesh(
    new THREE.PlaneGeometry(0.3, 6),
    new THREE.MeshStandardMaterial({ color: 0xffffff })
  );
  stripe.rotation.x = -Math.PI / 2;
  stripe.position.set(0, 0.05, z);
  scene.add(stripe);
}

// Sidewalks
for (const side of [-1, 1]) {
  const sidewalk = new THREE.Mesh(
    new THREE.BoxGeometry(5, 0.3, 400),
    new THREE.MeshStandardMaterial({ color: 0x999999 })
  );
  sidewalk.position.set(side * 12.5, 0.15, 0);
  scene.add(sidewalk);
}

// Buildings
for (let i = 0; i < 60; i++) {
  const height = 10 + Math.random() * 40;
  const width = 8 + Math.random() * 12;
  const depth = 8 + Math.random() * 12;
  const side = Math.random() > 0.5 ? 1 : -1;

  const building = new THREE.Mesh(
    new THREE.BoxGeometry(width, height, depth),
    new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(
        0.55 + Math.random() * 0.12,
        0.15 + Math.random() * 0.2,
        0.35 + Math.random() * 0.25
      )
    })
  );

  building.position.set(
    side * (22 + Math.random() * 35),
    height / 2,
    Math.random() * 380 - 190
  );

  building.castShadow = true;
  building.receiveShadow = true;
  scene.add(building);
}

// Player
const player = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.6, 1.4, 4, 8),
  new THREE.MeshStandardMaterial({ color: 0x2255ff })
);
player.position.set(4, 1.5, 0);
player.castShadow = true;
scene.add(player);

// Camera
camera.position.set(0, 6, 10);
camera.lookAt(player.position);

// Controls
const keys = {};

window.addEventListener('keydown', event => {
  keys[event.key.toLowerCase()] = true;
});

window.addEventListener('keyup', event => {
  keys[event.key.toLowerCase()] = false;
});

function animate() {
  requestAnimationFrame(animate);

  const speed = 0.18;

  if (keys['w'] || keys['arrowup']) player.position.z -= speed;
  if (keys['s'] || keys['arrowdown']) player.position.z += speed;
  if (keys['a'] || keys['arrowleft']) player.position.x -= speed;
  if (keys['d'] || keys['arrowright']) player.position.x += speed;

  player.position.x = Math.max(-8, Math.min(8, player.position.x));

  camera.position.x = player.position.x;
  camera.position.z = player.position.z + 10;
  camera.position.y = player.position.y + 5;
  camera.lookAt(player.position);

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
