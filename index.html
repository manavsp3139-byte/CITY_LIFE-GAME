<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Life</title>
<style>
body { margin:0; overflow:hidden; font-family:Arial,sans-serif; }
canvas { display:block; }
#hud {
  position:absolute;top:15px;left:15px;color:white;
  background:rgba(0,0,0,.7);padding:14px;border-radius:10px;
  z-index:2;user-select:none;
}
</style>
</head>
<body>
<div id="hud">
  <h2>🌆 CITY LIFE</h2>
  <div>WASD - Walk</div>
  <div>SHIFT - Sprint</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 90, 350);

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x526044,2));

const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(60,100,40);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

// Ground
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(500,500),
 new THREE.MeshStandardMaterial({color:0x527b48})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// Road
const road=new THREE.Mesh(
 new THREE.PlaneGeometry(22,400),
 new THREE.MeshStandardMaterial({color:0x292929})
);
road.rotation.x=-Math.PI/2;
road.position.y=.03;
scene.add(road);

// Road markings
for(let z=-190;z<200;z+=12){
 const stripe=new THREE.Mesh(
  new THREE.PlaneGeometry(.3,6),
  new THREE.MeshBasicMaterial({color:0xffffff})
 );
 stripe.rotation.x=-Math.PI/2;
 stripe.position.set(0,.05,z);
 scene.add(stripe);
}

// Pavements
for(const side of [-1,1]){
 const pavement=new THREE.Mesh(
  new THREE.BoxGeometry(5,.3,400),
  new THREE.MeshStandardMaterial({color:0x999999})
 );
 pavement.position.set(side*13.5,.15,0);
 pavement.receiveShadow=true;
 scene.add(pavement);
}

// Building collision boxes
const obstacles=[];

function addBuilding(x,z,w,d,h,color){
 const building=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color:color,roughness:.8})
 );
 body.position.y=h/2;
 body.castShadow=true;
 body.receiveShadow=true;
 building.add(body);

 // Rows of windows
 const rows=Math.floor(h/4);
 const cols=Math.max(2,Math.floor(w/3));

 for(let row=0;row<rows;row++){
  for(let col=0;col<cols;col++){
   const windowMesh=new THREE.Mesh(
    new THREE.BoxGeometry(.8,1.2,.08),
    new THREE.MeshStandardMaterial({
     color:Math.random()>.3?0x83c6df:0xffd98a,
     roughness:.25,
     metalness:.2
    })
   );
   windowMesh.position.set(
    -w/2+(col+.5)*(w/cols),
    2+row*3.5,
    d/2+.05
   );
   building.add(windowMesh);
  }
 }

 building.position.set(x,0,z);
 scene.add(building);

 obstacles.push({x,z,w,d});
}

// City buildings
for(let i=0;i<28;i++){
 const side=i%2===0?-1:1;
 const z=-160+i*12;
 const w=8+Math.random()*6;
 const d=8+Math.random()*8;
 const h=12+Math.random()*35;
 addBuilding(side*(25+Math.random()*12),z,w,d,h,
  new THREE.Color().setHSL(.55+Math.random()*.1,.15,.4+Math.random()*.2));
}

// Trees
function addTree(x,z){
 const tree=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.25,.35,3,8),
  new THREE.MeshStandardMaterial({color:0x6b4428})
 );
 trunk.position.y=1.5;
 trunk.castShadow=true;
 tree.add(trunk);

 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(2.2,10,8),
  new THREE.MeshStandardMaterial({color:0x267c38})
 );
 leaves.position.y=4;
 leaves.castShadow=true;
 tree.add(leaves);

 tree.position.set(x,0,z);
 scene.add(tree);
 obstacles.push({x,z,w:2.2,d:2.2});
}

for(let z=-180;z<180;z+=18){
 addTree(-17,z);
 addTree(17,z+8);
}

// Player
const player=new THREE.Group();

const torso=new THREE.Mesh(
 new THREE.CapsuleGeometry(.45,.9,4,8),
 new THREE.MeshStandardMaterial({color:0x2255ff})
);
torso.position.y=1.35;
torso.castShadow=true;
player.add(torso);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.28,16,16),
 new THREE.MeshStandardMaterial({color:0xffc69c})
);
head.position.y=2.25;
player.add(head);

player.position.set(0,0,0);
scene.add(player);

// Camera follow
const cameraOffset=new THREE.Vector3(0,5,9);
const cameraTarget=new THREE.Vector3();
const cameraDesired=new THREE.Vector3();

camera.position.set(0,5,9);
camera.lookAt(player.position);

// Controls
const keys={};
window.addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
});
window.addEventListener('keyup',e=>{
 keys[e.key.toLowerCase()]=false;
});

// Collision check
function blocked(x,z){
 for(const o of obstacles){
  if(Math.abs(x-o.x)<o.w/2+0.7 &&
     Math.abs(z-o.z)<o.d/2+0.7) return true;
 }
 return false;
}

const clock=new THREE.Clock();
let playerAngle=0;

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);

 let mx=0,mz=0;
 if(keys['w']) mz-=1;
 if(keys['s']) mz+=1;
 if(keys['a']) mx-=1;
 if(keys['d']) mx+=1;

 const length=Math.hypot(mx,mz);
 if(length>0){
  mx/=length;mz/=length;
  const speed=keys['shift']?12:6;
  const dx=mx*speed*dt;
  const dz=mz*speed*dt;

  if(!blocked(player.position.x+dx,player.position.z))
   player.position.x+=dx;
  if(!blocked(player.position.x,player.position.z+dz))
   player.position.z+=dz;

  playerAngle=Math.atan2(mx,mz);
  player.rotation.y=playerAngle;
 }

 // Smooth camera follow
 cameraDesired.set(
  player.position.x+cameraOffset.x,
  player.position.y+cameraOffset.y,
  player.position.z+cameraOffset.z
 );

 camera.position.lerp(cameraDesired,1-Math.exp(-4*dt));

 cameraTarget.set(player.position.x,player.position.y+1.5,player.position.z);
 camera.lookAt(cameraTarget);

 renderer.render(scene,camera);
}

animate();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
