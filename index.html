<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Life - Vadodara</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#87b6d9}
#hud{
position:fixed;left:12px;top:12px;z-index:5;color:white;
background:rgba(20,25,32,.85);padding:14px;border-radius:12px;
font-size:14px;line-height:1.7
}
#mapbtn{
position:fixed;right:12px;top:12px;z-index:6;
padding:12px;border:0;border-radius:10px;background:#222;color:white;
font-weight:bold;cursor:pointer
}
#mapOverlay{
display:none;position:fixed;inset:0;background:rgba(10,15,20,.95);
z-index:10;color:white;padding:25px;overflow:auto
}
#mapOverlay h2{text-align:center}
#cityMap{
display:block;margin:15px auto;width:min(90vw,700px);
height:min(90vw,700px);background:#738f65;border:3px solid white;
border-radius:12px
}
#closeMap{
display:block;margin:15px auto;padding:12px 25px;
border:0;border-radius:8px;font-size:16px
}
#status{
position:fixed;bottom:15px;left:50%;transform:translateX(-50%);
background:rgba(0,0,0,.7);color:white;padding:10px 20px;
border-radius:10px;z-index:5
}
</style>
</head>
<body>

<div id="hud">
<b>🏙️ CITY LIFE: VADODARA</b><br>
WASD / Arrow keys: Move<br>
SHIFT: Sprint<br>
E: Enter / Exit vehicle<br>
Drag mouse: Camera<br>
M: Map<br>
<div id="vehicleStatus">Walking</div>
</div>

<button id="mapbtn">🗺️ MAP (M)</button>

<div id="mapOverlay">

ground.receiveShadow=true;

const player=new THREE.Group();

const skin=new THREE.MeshStandardMaterial({color:0xb98059});
const shirt=new THREE.MeshStandardMaterial({color:0x2674d9});
const pants=new THREE.MeshStandardMaterial({color:0x25374b});

const torso=new THREE.Mesh(new THREE.BoxGeometry(.65,.85,.35),shirt);
torso.position.y=1.25;
player.add(torso);

const head=new THREE.Mesh(new THREE.SphereGeometry(.23,16,12),skin);
head.position.y=1.92;
player.add(head);

const legs=[];
for(let i=0;i<2;i++){
const leg=new THREE.Mesh(new THREE.BoxGeometry(.22,.7,.25),pants);
leg.position.set(i===0?-.15:.15,.45,0);
player.add(leg);
legs.push(leg);
}

const arms=[];
for(let i=0;i<2;i++){
const arm=new THREE.Mesh(new THREE.BoxGeometry(.18,.65,.2),skin);
arm.position.set(i===0?-.43:.43,1.25,0);
player.add(arm);
arms.push(arm);
}

player.position.set(0,0,0);

// Materials
function mat(color,rough=.85){
return new THREE.MeshStandardMaterial({color,roughness:rough});
}

const asphalt=mat(0x30343a);
const sidewalkMat=mat(0xc4c0b5);
const white=mat(0xffffff);

// Roads
function makeRoad(x,z,w,d){
const road=new THREE.Mesh(new THREE.BoxGeometry(w,.08,d),asphalt);
road.position.set(x,.03,z);
road.receiveShadow=true;
scene.add(road);

// Sidewalks only along the edges of each road
if(w>d){
for(let s of [-1,1]){
const walk=new THREE.Mesh(new THREE.BoxGeometry(w,.16,2.5),sidewalkMat);
walk.position.set(x,.12,z+s*(d/2+1.25));
scene.add(walk);
}
}else{
for(let s of [-1,1]){
const walk=new THREE.Mesh(new THREE.BoxGeometry(2.5,.16,d),sidewalkMat);
walk.position.set(x+s*(w/2+1.25),.12,z);
scene.add(walk);
}
}
}

function dashedLine(x,z,w,d,alongX){
for(let i=-Math.floor((alongX?w:d)/2)+6;i<(alongX?w:d)/2;i+=12){
const stripe=new THREE.Mesh(
new THREE.BoxGeometry(alongX?4:.25,.09,alongX?.25:4),
white
);
stripe.position.set(alongX?x+i:x,.1,alongX?z:z+i);
scene.add(stripe);
}
}

// Main grid roads
makeRoad(0,0,24,700);
makeRoad(0,0,700,24);
makeRoad(-200,0,16,700);
makeRoad(200,0,16,700);
makeRoad(0,-200,700,16);
makeRoad(0,200,700,16);
makeRoad(0,300,700,18);
makeRoad(0,-300,700,18);

dashedLine(0,0,700,24,true);
dashedLine(0,0,24,700,false);

// Smaller roads
for(let x=-300;x<=300;x+=100){
if(Math.abs(x)<30)continue;
makeRoad(x,0,12,600);
}
for(let z=-300;z<=300;z+=100){
if(Math.abs(z)<30)continue;
makeRoad(0,z,600,12);
}

// Buildings
function building(x,z,w,d,h,color,name){
const g=new THREE.Group();

const base=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
base.position.y=h/2;
base.castShadow=true;
base.receiveShadow=true;
g.add(base);

// Windows on the front
const cols=Math.max(2,Math.floor(w/3));
const rows=Math.max(2,Math.floor(h/3));

for(let r=1;r<rows;r++){
for(let c=0;c<cols;c++){
const win=new THREE.Mesh(
new THREE.BoxGeometry(.85,1.1,.08),
mat(0x8bb5cb,.3)
);
win.position.set(-w/2+(c+.5)*w/cols,r*h/rows,d/2+.05);
g.add(win);
}
}

// Roof
const roof=new THREE.Mesh(
new THREE.BoxGeometry(w+.4,.3,d+.4),
mat(0x55565a)
);
roof.position.y=h+.15;
g.add(roof);

g.position.set(x,0,z);
scene.add(g);
return g;
}

);

}

// Apartment complex inspired by Alembic Kiara
function tower(x,z,w,d,floors){
const g=new THREE.Group();
const h=floors*3.1;

const base=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
mat(0xc5b69c)
);
base.position.y=h/2;
base.castShadow=true;
g.add(base);

// Balcony / facade bands
for(let floor=1;floor<floors;floor++){
const band=new THREE.Mesh(
new THREE.BoxGeometry(w+.3,.15,d+.3),
mat(0x766958)
);
band.position.y=floor*3.1;
g.add(band);
}

// Window grid
for(let f=0;f<floors;f++){
for(let c=0;c<Math.floor(w/2.8);c++){
const win=new THREE.Mesh(
new THREE.BoxGeometry(1.15,1.7,.08),
mat(0x63889c,.35)
);
win.position.set(-w/2+2+c*2.8,f*3.1+1.7,d/2+.05);
g.add(win);
}
}

g.position.set(x,0,z);
scene.add(g);
}

function archGateway(x,z){
const g=new THREE.Group();
const stone=mat(0x9a8066);

// Left and right stone piers
for(let s of [-1,1]){
const pier=new THREE.Mesh(

new THREE.BoxGeometry(38,2,5),
ivory
);
parapet.position.y=18;

const dome=new THREE.Mesh(
new THREE.ConeGeometry(3,5,8),
ivory
);
dome.position.set(s*12,21,0);
g.add(dome);
}

// Arch opening: left and right arch sides plus curved-looking crown segments
const archSideL=new THREE.Mesh(new THREE.BoxGeometry(7,10,5),ivory);
archSideL.position.set(-5,5,0);
g.add(archSideL);

const archSideR=new THREE.Mesh(new THREE.BoxGeometry(7,10,5),ivory);
archSideR.position.set(5,5,0);
g.add(archSideR);

const crown=new THREE.Mesh(
new THREE.BoxGeometry(12,3,5),
ivory
);
crown.position.y=11;
g.add(crown);

// Decorative arch curve
for(let i=0;i<9;i++){
const a=Math.PI*i/8;
const b=new THREE.Mesh(
new THREE.BoxGeometry(1.3,1.3,5.2),
ivory
);
b.position.set(Math.cos(a)*6,5+Math.sin(a)*5,0);
g.add(b);
}

g.position.set(x,0,z);
scene.add(g);
}

// Sign
function sign(x,y,z,text,color){
const canvas=document.createElement('canvas');
canvas.width=512;canvas.height=128;
const ctx=canvas.getContext('2d');
ctx.fillStyle=color;
ctx.fillRect(0,0,512,128);
ctx.fillStyle='#ffffff';
ctx.font='bold 45px Arial';
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.fillText(text,256,64);
const tex=new THREE.CanvasTexture(canvas);
const m=new THREE.Mesh(
new THREE.PlaneGeometry(18,4),
new THREE.MeshBasicMaterial({map:tex})
);
m.position.set(x,y,z);
scene.add(m);
}

function updateLights(t){
const phase=Math.floor(t/5)%3;
lights.forEach(l=>{
l.forEach((lamp,i)=>{
lamp.material.color.setHex(i===phase?[0xff0000,0xffaa00,0x00ff00][i]:0x333333);
lamp.material.emissive.setHex(i===phase?[0xff0000,0xffaa00,0x00ff00][i]:0);
});
});
}

// Vehicles
const cars=[];
function makeCar(x,z,color){
const g=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(4.2,1.15,2),
mat(color)
);
body.position.y=1;
g.add(body);

// hood
const hood=new THREE.Mesh(
new THREE.BoxGeometry(1.2,.45,2),
mat(color)
);
hood.position.set(1.5,1.5,0);
g.add(hood);

// cabin
const cabin=new THREE.Mesh(
new THREE.BoxGeometry(2.3,1.05,1.65),
mat(0x8aa9ba,.35)
);
cabin.position.y=2;
g.add(cabin);

// wheels
const wheels=[];
for(let i=0;i<4;i++){
const wheel=new THREE.Mesh(
new THREE.CylinderGeometry(.5,.5,.35,16),
mat(0x242424)
);
wheel.rotation.z=Math.PI/2;
wheel.position.set(i<2?-1.3:1.3,.5,i%2===0?1:-1);
g.add(wheel);
wheels.push(wheel);
}

g.position.set(x,0,z);
scene.add(g);
cars.push({group:g,velocity:0,wheels});
}

addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let yaw=0;
let camYaw=0;
let camPitch=.35;
let dragging=false,lastX=0,lastY=0;

renderer.domElement.addEventListener('pointerdown',e=>{
dragging=true;
lastX=e.clientX;
lastY=e.clientY;
});
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{
if(!dragging)return;
camYaw-=(e.clientX-lastX)*.005;
camPitch=Math.max(-.1,Math.min(1.2,camPitch+(e.clientY-lastY)*.004));
lastX=e.clientX;
lastY=e.clientY;
});

// Driving
let activeCar=null;
function toggleCar(){
if(activeCar){
player.position.copy(activeCar.group.position);
activeCar.velocity=0;
activeCar=null;
document.getElementById('vehicleStatus').textContent='Walking';
return;
}
let nearest=null,dist=7;
for(const c of cars){
const d=player.position.distanceTo(c.group.position);
if(d<dist){nearest=c;dist=d;}
}
if(nearest){
activeCar=nearest;
document.getElementById('vehicleStatus').textContent='Driving';
}
}

// Map
const mapOverlay=document.getElementById('mapOverlay');
function toggleMap(){
mapOverlay.style.display=mapOverlay.style.display==='block'?'none':'block';
drawMap();
}
document.getElementById('mapbtn').onclick=toggleMap;
document.getElementById('closeMap').onclick=toggleMap;

function drawMap(){
const c=document.getElementById('cityMap');
const ctx=c.getContext('2d');
const W=c.width,H=c.height;

ctx.fillStyle='#789b63';
ctx.fillRect(0,0,W,H);

// Road grid
ctx.fillStyle='#333';
for(let i=100;i<650;i+=100){
ctx.fillRect(i-8,0,16,H);
ctx.fillRect(0,i-8,W,16);
}
ctx.fillRect(330-12,0,24,H);
ctx.fillRect(0,330-12,W,24);

// Airport
ctx.fillStyle='#8c8c8c';
ctx.fillRect(500,40,150,90);
ctx.fillStyle='#b8c8d8';
ctx.fillRect(520,60,110,30);
ctx.fillStyle='white';
ctx.font='16px Arial';
ctx.fillText('AIRPORT',530,110);

// Market
ctx.fillStyle='#c89a6b';
ctx.fillRect(350,220,120,120);
ctx.fillStyle='white';
ctx.fillText('MANGAL',370,270);
ctx.fillText('BAZAAR',370,290);

// Ground
ctx.fillStyle='#65a147';
ctx.fillRect(40,350,150,130);
ctx.strokeStyle='#ddd';
ctx.strokeRect(40,350,150,130);
ctx.fillStyle='white';
ctx.fillText('MEHSANA',65,415);
ctx.fillText('GROUND',65,435);

// Towers
ctx.fillStyle='#b9ae98';
ctx.fillRect(500,400,150,130);
ctx.fillStyle='white';
ctx.fillText('KIARA',550,470);

// Temple
ctx.fillStyle='#e3c8a8';
ctx.fillRect(60,520,110,100);
ctx.fillStyle='white';
ctx.fillText('TEMPLE',85,570);

// Player
const px=350+(player.position.x/700)*300;
const pz=350+(player.position.z/700)*300;
ctx.fillStyle='#ff3333';
ctx.beginPath();
ctx.arc(px,pz,7,0,Math.PI*2);
ctx.fill();

// Legend
ctx.fillStyle='white';
ctx.font='18px Arial';
ctx.fillText('● YOU',20,30);
}

// Animation
const clock=new THREE.Clock();

function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),.05);
const t=clock.elapsedTime;

updateLights(t);
clouds.forEach(c=>c.position.x+=dt*1.5);

if(activeCar){
if(keys.w||keys.arrowup)activeCar.velocity=Math.min(activeCar.velocity+dt*12,35);
if(keys.s||keys.arrowdown)activeCar.velocity=Math.max(activeCar.velocity-dt*18,-12);
if(!keys.w&&!keys.s&&!keys.arrowup&&!keys.arrowdown)
activeCar.velocity*=.985;

if(keys.a||keys.arrowleft)activeCar.group.rotation.y+=dt*1.5;
if(keys.d||keys.arrowright)activeCar.group.rotation.y-=dt*1.5;

const dir=new THREE.Vector3(
Math.sin(activeCar.group.rotation.y),0,
Math.cos(activeCar.group.rotation.y)
);
activeCar.group.position.addScaledVector(dir,activeCar.velocity*dt);
player.position.copy(activeCar.group.position);
player.rotation.y=activeCar.group.rotation.y;
}else{
let move=0,turn=0;
if(keys.w||keys.arrowup)move=1;
if(keys.s||keys.arrowdown)move=-1;
if(keys.a||keys.arrowleft)turn=1;
if(keys.d||keys.arrowright)turn=-1;

if(move){
yaw+=turn*dt*2;
const speed=keys.shift?20:12;
player.position.x+=Math.sin(yaw)*move*speed*dt;
player.position.z+=Math.cos(yaw)*move*speed*dt;
player.rotation.y=yaw;
}
legs.forEach((l,i)=>l.rotation.x=move*Math.sin(t*8+i*Math.PI)*.4);
arms.forEach((a,i)=>a.rotation.x=move*Math.sin(t*8+i*Math.PI)*.3);
}

npcs.forEach(n=>{
n.g.position.x=n.x+Math.sin(t+n.phase)*2;
n.g.position.z=n.z+Math.cos(t+n.phase)*2;
});

const target=new THREE.Vector3(
player.position.x+Math.sin(camYaw)*18,
player.position.y+8+camPitch*10,
player.position.z+Math.cos(camYaw)*18
);
camera.position.lerp(target,.08);
camera.lookAt(player.position.x,player.position.y+1,player.position.z);

renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
