<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Life Gujarat</title>

<style>
body {
 margin:0;
 overflow:hidden;
 font-family:Arial,sans-serif;
}

#ui {
 position:absolute;
 top:10px;
 left:10px;
 color:white;
 background:rgba(0,0,0,.7);
 padding:12px;
 border-radius:10px;
 z-index:2;
 line-height:1.6;
}

#mini {
 position:absolute;
 top:10px;
 right:10px;
 width:180px;
 height:180px;
 border:3px solid white;
 border-radius:8px;
 background:#222;
 z-index:2;
}

#bigmap {
 display:none;
 position:absolute;
 top:50%;
 left:50%;
 transform:translate(-50%,-50%);
 width:min(80vw,80vh);
 height:min(80vw,80vh);
 background:#222;
 border:4px solid white;
 border-radius:10px;
 z-index:5;
}

#message {
 position:absolute;
 bottom:25px;
 left:50%;
 transform:translateX(-50%);
 color:white;
 background:rgba(0,0,0,.7);
 padding:12px;
 border-radius:10px;
 z-index:2;
 text-align:center;
}
</style>
</head>

<body>

<div id="ui">
<b>CITY LIFE: GUJARAT</b><br>
WASD / Arrows: Move<br>
Mouse drag: Rotate camera<br>
Shift: Sprint<br>
E: Enter / Exit car<br>
M: Map
</div>

<canvas id="mini" width="180" height="180"></canvas>
<canvas id="bigmap" width="600" height="600"></canvas>
<div id="message">Explore the city. Press E near a car.</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ---------------- SETUP ----------------

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb,180,450);

const camera = new THREE.PerspectiveCamera(
 70,innerWidth/innerHeight,.1,1000
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(100,150,80);
scene.add(sun);

// ---------------- WORLD ----------------

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(500,500),
 new THREE.MeshStandardMaterial({color:0x557c45})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

// Main roads

function road(x,z,w,d){
 const r=new THREE.Mesh(
  new THREE.BoxGeometry(w,.12,d),
  new THREE.MeshStandardMaterial({color:0x333333})
 );
 r.position.set(x,.06,z);
 scene.add(r);
}

road(0,0,20,500);
road(0,0,500,20);

// Road markings

for(let i=-240;i<240;i+=12){
 const stripe=new THREE.Mesh(
  new THREE.BoxGeometry(.35,.15,5),
  new THREE.MeshStandardMaterial({color:0xffffff})
 );
 stripe.position.set(0,.14,i);
 scene.add(stripe);

 const stripe2=new THREE.Mesh(
  new THREE.BoxGeometry(5,.15,.35),
  new THREE.MeshStandardMaterial({color:0xffffff})
 );
 stripe2.position.set(i,.14,0);
 scene.add(stripe2);
}

// ---------------- BUILDINGS ----------------

const buildings=[];

for(let i=0;i<150;i++){
 let x=(Math.random()-.5)*440;
 let z=(Math.random()-.5)*440;

 if(Math.abs(x)<22 || Math.abs(z)<22)continue;

 let w=8+Math.random()*15;
 let d=8+Math.random()*15;
 let h=8+Math.random()*50;

 const building=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({
   color:new THREE.Color().setHSL(
    .08+Math.random()*.1,.25,.4+Math.random()*.2
   )
  })
 );

 building.position.set(x,h/2,z);
 scene.add(building);

 buildings.push({x,z,w,d});
}

// ---------------- TREES ----------------

function createTree(x,z){
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.3,.5,3,8),
  new THREE.MeshStandardMaterial({color:0x79502b})
 );
 trunk.position.set(x,1.5,z);
 scene.add(trunk);

 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(2.5,8,8),
  new THREE.MeshStandardMaterial({color:0x228833})
 );
 leaves.position.set(x,4,z);
 scene.add(leaves);
}

for(let i=0;i<100;i++){
 let x=(Math.random()-.5)*440;
 let z=(Math.random()-.5)*440;
 if(Math.abs(x)<15||Math.abs(z)<15)continue;
 createTree(x,z);
}

// ---------------- PERSON ----------------

function createPerson(color=0x2255ff){
 const person=new THREE.Group();

 const torso=new THREE.Mesh(
  new THREE.CapsuleGeometry(.55,.9,4,8),
  new THREE.MeshStandardMaterial({color})
 );
 torso.position.y=1.3;
 person.add(torso);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.35,12,12),
  new THREE.MeshStandardMaterial({color:0xffcc99})
 );
 head.position.y=2.25;
 person.add(head);

 return person;
}

const player=createPerson();
scene.add(player);

player.position.set(0,0,30);

// ---------------- CARS ----------------

const cars=[];
const carColors=[
 0xdd2222,0xffffff,0x2222cc,
 0xffff00,0x222222,0x22aa66,
 0xff8800
];

function createCar(color=0xff2222){
 const car=new THREE.Group();

 // Body
 const body=new THREE.Mesh(
  new THREE.BoxGeometry(2.2,1,4.5),
  new THREE.MeshStandardMaterial({color})
 );
 body.position.y=1;
 car.add(body);

 // Roof
 const roof=new THREE.Mesh(
  new THREE.BoxGeometry(1.65,.85,2.2),
  new THREE.MeshStandardMaterial({color:0x445566})
 );
 roof.position.set(0,1.85,-.15);
 car.add(roof);

 // Windows
 const glassMat=new THREE.MeshStandardMaterial({
  color:0x88bbdd,
  transparent:true,
  opacity:.65
 });

 const frontGlass=new THREE.Mesh(
  new THREE.BoxGeometry(1.5,.55,.12),
  glassMat
 );
 frontGlass.position.set(0,1.8,1);
 car.add(frontGlass);

 const rearGlass=new THREE.Mesh(
  new THREE.BoxGeometry(1.5,.55,.12),
  glassMat
 );
 rearGlass.position.set(0,1.8,-1.25);
 car.add(rearGlass);

 // Wheels
 const wheels=[];

 for(const x of [-1.1,1.1]){
  for(const z of [-1.5,1.5]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.45,.45,.35,16),
    new THREE.MeshStandardMaterial({color:0x111111})
   );

   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x,.55,z);
   car.add(wheel);
   wheels.push(wheel);
  }
 }

 // Headlights
 for(const x of [-.7,.7]){
  const light=new THREE.Mesh(
   new THREE.BoxGeometry(.4,.22,.1),
   new THREE.MeshStandardMaterial({
    color:0xffffcc,
    emissive:0x777755
   })
  );
  light.position.set(x,1,2.27);
  car.add(light);

  const tail=new THREE.Mesh(
   new THREE.BoxGeometry(.4,.22,.1),
   new THREE.MeshStandardMaterial({
    color:0xff0000,
    emissive:0x550000
   })
  );
  tail.position.set(x,1,-2.27);
  car.add(tail);
 }

 // Driver and passenger figures
 const driver=createPerson(0x333333);
 driver.scale.set(.45,.65,.45);
 driver.position.set(-.45,1.25,.1);
 car.add(driver);

 const passenger=createPerson(0x774422);
 passenger.scale.set(.45,.65,.45);
 passenger.position.set(.45,1.25,.1);
 car.add(passenger);

 scene.add(car);

 return {car,wheels,driver,passenger};
}

// Traffic cars

for(let i=0;i<6;i++){
 let c=createCar(carColors[i%carColors.length]);
 c.car.position.set(-5,0,-200+i*70);
 cars.push({
  ...c,
  npc:true,
  axis:'z',
  direction:1,
  speed:5+Math.random()*4
 });

 let c2=createCar(carColors[(i+2)%carColors.length]);
 c2.car.position.set(5,0,200-i*70);
 cars.push({
  ...c2,
  npc:true,
  axis:'z',
  direction:-1,
  speed:5+Math.random()*4
 });
}

for(let i=0;i<5;i++){
 let c=createCar(carColors[(i+3)%carColors.length]);
 c.car.position.set(-200+i*80,-0,5);
 c.car.rotation.y=Math.PI/2;
 cars.push({
  ...c,
  npc:true,
  axis:'x',
  direction:1,
  speed:5+Math.random()*4
 });
}

// Additional driveable cars

for(let i=0;i<5;i++){
 let c=createCar(carColors[(i+1)%carColors.length]);
 c.car.position.set(25+i*8,0,30);
 c.car.rotation.y=Math.PI;
 cars.push({
  ...c,
  npc:false,
  speed:0,
  velocity:0,
  steering:0
 });
}

// ---------------- INPUT ----------------

const keys={};

addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;

 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)){
  e.preventDefault();
 }

 if(e.key.toLowerCase()==='e'&&!e.repeat){
  enterExitCar();
 }

 if(e.key.toLowerCase()==='m'&&!e.repeat){
  toggleMap();
 }
});

addEventListener('keyup',e=>{
 keys[e.key.toLowerCase()]=false;
});

addEventListener('blur',()=>{
 for(const k in keys)keys[k]=false;
});

// ---------------- CAMERA ----------------

let cameraYaw=0;
let cameraPitch=.25;
let mouseDown=false;
let lastMouseX=0,lastMouseY=0;

renderer.domElement.addEventListener('mousedown',e=>{
 mouseDown=true;
 lastMouseX=e.clientX;
 lastMouseY=e.clientY;
});

addEventListener('mouseup',()=>mouseDown=false);

addEventListener('mousemove',e=>{
 if(!mouseDown)return;

 cameraYaw-=(e.clientX-lastMouseX)*.005;
 cameraPitch+=(e.clientY-lastMouseY)*.004;

 cameraPitch=Math.max(-.5,Math.min(1.1,cameraPitch));

 lastMouseX=e.clientX;
 lastMouseY=e.clientY;
});

// ---------------- ENTER CAR ----------------

let currentCar=null;

function enterExitCar(){
 if(currentCar){
  player.visible=true;

  const exitOffset=new THREE.Vector3(3,0,0);
  exitOffset.applyAxisAngle(
   new THREE.Vector3(0,1,0),
   currentCar.car.rotation.y
  );

  player.position.copy(currentCar.car.position).add(exitOffset);
  player.position.y=0;

  currentCar=null;
  showMessage("Exited car");
  return;
 }

 let nearest=null;
 let distance=Infinity;

 cars.forEach(c=>{
  if(c.npc)return;

  const d=player.position.distanceTo(c.car.position);
  if(d<distance){
   distance=d;
   nearest=c;
  }
 });

 if(nearest&&distance<8){
  currentCar=nearest;
  player.visible=false;
  currentCar.velocity=0;
  showMessage("Driving! WASD or arrows. E to exit.");
 }else{
  showMessage("Move closer to a parked car.");
 }
}

// ---------------- MAP ----------------

const mini=document.getElementById('mini');
const miniCtx=mini.getContext('2d');

const bigmap=document.getElementById('bigmap');
const bigCtx=bigmap.getContext('2d');

let mapOpen=false;

function toggleMap(){
 mapOpen=!mapOpen;
 bigmap.style.display=mapOpen?'block':'none';
}

function drawMap(ctx,size){
 ctx.clearRect(0,0,size,size);

 ctx.fillStyle='#557c45';
 ctx.fillRect(0,0,size,size);

 const scale=size/500;

 ctx.fillStyle='#333';
 ctx.fillRect(size/2-10*scale,0,20*scale,size);
 ctx.fillRect(0,size/2-10*scale,size,20*scale);

 ctx.fillStyle='white';
 ctx.fillRect(size/2-.2*scale,0,.4*scale,size);
 ctx.fillRect(0,size/2-.2*scale,size,.4*scale);

 // Player
 const p=currentCar?currentCar.car.position:player.position;

 const px=size/2+p.x*scale;
 const py=size/2+p.z*scale;

 // Cars
 cars.forEach(c=>{
  const x=size/2+c.car.position.x*scale;
  const y=size/2+c.car.position.z*scale;

  ctx.fillStyle=c===currentCar?'cyan':'red';
  ctx.fillRect(x-3,y-3,6,6);
 });

 ctx.fillStyle='cyan';
 ctx.beginPath();
 ctx.arc(px,py,5,0,Math.PI*2);
 ctx.fill();
}

function drawMaps(){
 drawMap(miniCtx,180);

 if(mapOpen){
  drawMap(bigCtx,600);
 }
}

// ---------------- MESSAGE ----------------

const message=document.getElementById('message');
let messageTimer;

function showMessage(text){
 message.textContent=text;
 clearTimeout(messageTimer);

 messageTimer=setTimeout(()=>{
  message.textContent="WASD / Arrows | E car | M map";
 },2500);
}

// ---------------- GAME ----------------

const clock=new THREE.Clock();

function update(dt){

 // NPC Traffic

 cars.forEach(c=>{
  if(!c.npc)return;

  if(c.axis==='z'){
   c.car.position.z+=c.direction*c.speed*dt;

   if(c.car.position.z>250)c.car.position.z=-250;
   if(c.car.position.z<-250)c.car.position.z=250;
  }

  if(c.axis==='x'){
   c.car.position.x+=c.direction*c.speed*dt;

   if(c.car.position.x>250)c.car.position.x=-250;
   if(c.car.position.x<-250)c.car.position.x=250;
  }
 });

 // Player on foot

 if(!currentCar){

  let mx=0,mz=0;

  if(keys['w']||keys['arrowup'])mz-=1;
  if(keys['s']||keys['arrowdown'])mz+=1;
  if(keys['a']||keys['arrowleft'])mx-=1;
  if(keys['d']||keys['arrowright'])mx+=1;

  if(mx||mz){
   const len=Math.hypot(mx,mz);
   mx/=len;
   mz/=len;

   const speed=keys['shift']?12:6;

   player.position.x+=mx*speed*dt;
   player.position.z+=mz*speed*dt;

   player.rotation.y=Math.atan2(mx,mz);
  }
 }

 // Driving

 if(currentCar){

  const c=currentCar;

  let throttle=0;

  if(keys['w']||keys['arrowup'])throttle=1;
  if(keys['s']||keys['arrowdown'])throttle=-1;

  const maxSpeed=30;

  c.velocity+=throttle*15*dt;

  // Gradual slowing
  if(throttle===0){
   c.velocity*=Math.pow(.96,dt*60);
  }

  c.velocity=Math.max(-12,Math.min(maxSpeed,c.velocity));

  let steer=0;

  if(keys['a']||keys['arrowleft'])steer=1;
  if(keys['d']||keys['arrowright'])steer=-1;

  if(Math.abs(c.velocity)>.5){
   c.car.rotation.y+=steer*1.5*dt*
   (c.velocity>0?1:-1);
  }

  const forward=new THREE.Vector3(
   Math.sin(c.car.rotation.y),
   0,
   Math.cos(c.car.rotation.y)
  );

  c.car.position.addScaledVector(
   forward,
   c.velocity*dt
  );

  c.wheels.forEach(w=>{
   w.rotation.x+=c.velocity*dt*2;
  });

  c.car.position.x=Math.max(-240,Math.min(240,c.car.position.x));
  c.car.position.z=Math.max(-240,Math.min(240,c.car.position.z));
 }

 // Camera

 const targetObj=currentCar?currentCar.car:player;

 const target=new THREE.Vector3(
  targetObj.position.x,
  targetObj.position.y+1.5,
  targetObj.position.z
 );

 const distance=currentCar?12:8;

 const offset=new THREE.Vector3(
  Math.sin(cameraYaw)*distance,
  3+cameraPitch*8,
  Math.cos(cameraYaw)*distance
 );

 const desired=target.clone().add(offset);

 camera.position.lerp(desired,1-Math.pow(.001,dt));
 camera.lookAt(target);

 drawMaps();
}

function animate(){
 requestAnimationFrame(animate);
 update(clock.getDelta());
 renderer.render(scene,camera);
}

animate();

// ---------------- RESIZE ----------------

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
